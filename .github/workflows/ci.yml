name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,cli]"
      - run: pytest
      - name: Vendored policy schema matches vulnify-sdk main when that file exists
        run: python scripts/check_policies_schema.py
