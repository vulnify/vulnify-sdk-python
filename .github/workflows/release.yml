name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip build twine && python -m pip install -e ".[dev,cli]"
      - name: Test
        run: pytest
      - name: Tag matches the package version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v") or not tag[1:]:
              raise SystemExit(f"ref {tag!r} is not a v* tag")
          version = tag[1:]
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          init = pathlib.Path("vulnify/__init__.py").read_text()
          if pyproject != version:
              raise SystemExit(f"pyproject version {pyproject} does not match tag {tag}")
          if f'__version__ = "{version}"' not in init:
              raise SystemExit(f"vulnify.__version__ does not match tag {tag}")
          print(f"tag {tag} matches package version {version}")
          PY
      - name: Build
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Wheel includes py.typed
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist, found {wheels} {sdists}")
          with zipfile.ZipFile(wheels[0]) as zipped:
              names = zipped.namelist()
          if not any(name.endswith("py.typed") for name in names):
              raise SystemExit(f"py.typed missing from wheel: {names}")
          with tarfile.open(sdists[0]) as archived:
              names = archived.getnames()
          if not any(name.endswith("py.typed") for name in names):
              raise SystemExit(f"py.typed missing from sdist: {names}")
          schema = "vulnify/schema/policies.v1.json"
          with zipfile.ZipFile(wheels[0]) as zipped:
              names = zipped.namelist()
          if not any(name.endswith(schema) for name in names):
              raise SystemExit(f"{schema} missing from wheel: {names}")
          with tarfile.open(sdists[0]) as archived:
              names = archived.getnames()
          if not any(name.endswith(schema) for name in names):
              raise SystemExit(f"{schema} missing from sdist: {names}")
          print("py.typed and policies.v1.json are in the wheel and the sdist")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vulnify/
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Skip a version that is already on PyPI
        id: pypi
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          code="$(curl -sS -o /tmp/pypi-vulnify.json -w "%{http_code}" "https://pypi.org/pypi/vulnify/${version}/json")"
          if [ "$code" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "vulnify ${version} is already on PyPI. Skipping publish."
          elif [ "$code" = "404" ]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "vulnify ${version} is not on PyPI. Publishing."
          else
            echo "Unexpected PyPI status ${code} for vulnify ${version}" >&2
            cat /tmp/pypi-vulnify.json >&2
            exit 1
          fi
      - name: Publish to PyPI
        if: steps.pypi.outputs.already_published != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          skip-existing: true
          packages-dir: dist
