[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnify"
version = "0.1.0"
description = "Vulnify SDK: ask Vulnify whether an AI agent action is allowed before running it."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/vulnify/vulnify-sdk-python"
Repository = "https://github.com/vulnify/vulnify-sdk-python"

[tool.setuptools]
packages = ["vulnify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
