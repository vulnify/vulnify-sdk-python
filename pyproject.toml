[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnify"
version = "0.4.1"
description = "Vulnify SDK: ask Vulnify whether an AI agent action is allowed before running it."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "vulnify",
    "authorization",
    "ai-agents",
    "security",
    "runtime-security",
    "policy",
    "dlp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "PyYAML>=6", "jsonschema>=4.18"]
# PyYAML and jsonschema are only required for the console script.
cli = ["PyYAML>=6", "jsonschema>=4.18"]
# Framework packages are optional. The adapters stay duck-typed and import them lazily.
langchain = ["langchain-core>=0.3; python_version>='3.10'"]
openai-agents = ["openai-agents>=0.2; python_version>='3.10'"]
mcp = ["mcp>=1; python_version>='3.10'"]

[project.scripts]
vulnify = "vulnify.cli:console_main"

[project.urls]
Homepage = "https://vulnify.io"
Documentation = "https://docs.vulnify.io/sdks/python/"
Changelog = "https://github.com/vulnify/vulnify-sdk-python/blob/main/CHANGELOG.md"
Source = "https://github.com/vulnify/vulnify-sdk-python"
Issues = "https://github.com/vulnify/vulnify-sdk-python/issues"
Dashboard = "https://app.vulnify.io"

[tool.setuptools]
packages = ["vulnify", "vulnify.schema"]
include-package-data = true

[tool.setuptools.package-data]
vulnify = ["py.typed"]
"vulnify.schema" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
